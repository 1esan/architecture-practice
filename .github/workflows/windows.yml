name: Windows package
on:
  push:
    branches: [codex/windows-build]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Build and smoke test Windows app
        shell: powershell
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ArchitecturePractice-Windows-x64
          path: |
            dist-windows/ArchitecturePractice-Windows-x64.zip
            dist-windows/ArchitecturePractice-Windows-x64.zip.sha256
          if-no-files-found: error
